# Nessie Iceberg REST catalog backed by floci S3 (local AWS emulator).
# Heap capped: single-node kind on a 3.5GB Docker Desktop VM OOMKills otherwise.
extraEnv:
  - name: JAVA_OPTS_APPEND
    value: -Xmx768m
catalog:
  enabled: true
  iceberg:
    defaultWarehouse: lake
    warehouses:
      - name: lake
        location: s3://lake-warehouse/wh
  storage:
    s3:
      defaultOptions:
        region: us-east-1
        endpoint: http://host.docker.internal:4566
        pathStyleAccess: true
        authType: STATIC
        accessKeySecret:
          name: nessie-s3-creds
          awsAccessKeyId: aws_access_key_id
          awsSecretAccessKey: aws_secret_access_key
