# Lets Airflow (scheduler/worker pods) submit SparkApplications via
# SparkKubernetesOperator (uses the task pod's in-cluster service account).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: airflow-spark-submitter
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status", "scheduledsparkapplications"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: airflow-spark-submitter
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: data-platform
  - kind: ServiceAccount
    name: airflow-worker
    namespace: data-platform
roleRef:
  kind: ClusterRole
  name: airflow-spark-submitter
  apiGroup: rbac.authorization.k8s.io
